        <h4>흰꼬리수리</h4>
        <p>
            펼친 날개 길이가 1.7~2.4m에 달하는 몸집이 큰 맹금류다. <br>
            암수 같은 색이며, 성체의 몸은 갈색이고 꼬리는 흰색이며, 부리와 다리는 노란색이다. <br>
            암수 번갈아가며 알을 품는다. 직접 물고기를 사냥하기도 하지만 갈매기나 수달이 잡은 먹이를 뺏기도 한다. <br>
        </p>
